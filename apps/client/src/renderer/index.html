<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Voice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="./assets/Logo.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="./styles/theme.css">
</head>
<body>
  <div id="titlebar" class="titlebar">
    <div class="titlebar__drag">
      <img class="titlebar__logo" src="./assets/Logo.png" alt="" />
      <span class="titlebar__title">Mini Voice</span>
    </div>
    <div class="titlebar__controls">
      <button id="win-min" class="titlebar__btn" aria-label="Minimizar" title="Minimizar">
        <span class="material-symbols-outlined md-18">remove</span>
      </button>
      <button id="win-max" class="titlebar__btn" aria-label="Maximizar" title="Maximizar">
        <span class="material-symbols-outlined md-18">crop_square</span>
      </button>
      <button id="win-close" class="titlebar__btn titlebar__btn--close" aria-label="Fechar" title="Fechar">
        <span class="material-symbols-outlined md-18">close</span>
      </button>
    </div>
  </div>
  <div id="app"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
