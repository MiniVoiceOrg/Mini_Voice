name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      promote_tag:
        description: 'Beta tag to promote to a stable release (e.g. v1.8.0-beta.3). Leave empty to build a beta from the current ref.'
        required: false
        default: ''

concurrency:
  group: release-${{ github.event.inputs.promote_tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      prev_tag: ${{ steps.bump.outputs.prev_tag }}
      bump_type: ${{ steps.bump.outputs.bump_type }}
      channel: ${{ steps.bump.outputs.channel }}
      prerelease: ${{ steps.bump.outputs.prerelease }}
      checkout_ref: ${{ steps.ref.outputs.checkout_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # push to main / manual dispatch (no tag) -> beta prerelease.
      # manual dispatch with a beta tag -> promote that beta to a clean stable.
      - name: Calculate Semantic Version
        id: bump
        env:
          PROMOTE_TAG: ${{ github.event.inputs.promote_tag }}
          RELEASE_CHANNEL: beta
        run: node scripts/calculate-version.js

      - name: Resolve checkout ref
        id: ref
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.promote_tag }}" ]; then
            echo "checkout_ref=${{ github.event.inputs.promote_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "checkout_ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.platform }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.checkout_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python 3.11 (for node-gyp compatibility)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        run: npm ci

      # Upgrade node-gyp so @electron/rebuild can find VS 2022
      - name: Install node-gyp globally (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npm install -g node-gyp@latest
          echo "NODE_GYP_PATH=$(npm prefix -g)/node_modules/node-gyp/bin/node-gyp.js" >> $GITHUB_ENV

      - name: Build workspaces
        run: npm run build

      # tsc does not copy the .sql migration files into the compiled server
      # output, so we copy them next to the compiled DatabaseConnection.js. This
      # ensures the migrations are bundled inside the packaged @monky/server.
      - name: Copy database migrations into server dist
        shell: bash
        run: |
          mkdir -p apps/server/dist/infrastructure/database/migrations
          cp apps/server/src/infrastructure/database/migrations/*.sql \
             apps/server/dist/infrastructure/database/migrations/

      - name: Set build version
        shell: bash
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          node -e "const f='apps/client/package.json';const p=require('./'+f);p.version='${VERSION}';require('fs').writeFileSync(f, JSON.stringify(p, null, 2)+'\n');"
          echo "Packaged version set to ${VERSION}"

      - name: Build ${{ matrix.platform }} distributables
        working-directory: apps/client
        run: npx --no-install electron-builder --${{ matrix.platform }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_node_gyp: ${{ env.NODE_GYP_PATH || '' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml

  release:
    name: Publish GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG="${{ needs.version.outputs.prev_tag }}"
          echo "Previous tag: ${PREV_TAG:-<none>}"
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE=""
          fi

          # Prefer the descriptive per-issue lines from commit bodies
          # (e.g. "#44: reconecta imediatamente ..."); fall back to commit
          # subjects when a commit has no such lines. This yields a written
          # changelog that still references the issues.
          ITEM_LINES=$(git log $RANGE --no-merges --pretty=format:'%b' \
            | grep -E '^#[0-9]+:' | sed -E 's/^/- /' || true)
          if [ -z "$ITEM_LINES" ]; then
            ITEM_LINES=$(git log $RANGE --no-merges --pretty=format:'- %s' || true)
          fi
          if [ -z "$ITEM_LINES" ]; then
            ITEM_LINES="- Melhorias diversas e correções."
          fi

          {
            echo "notes<<CHANGELOG_EOF"
            echo "$ITEM_LINES"
            echo ""
            echo "**Comparação completa**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...v${{ needs.version.outputs.version }}"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -R artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.channel == 'beta' && format('Monky v{0} (Beta)', needs.version.outputs.version) || format('Monky v{0}', needs.version.outputs.version) }}
          body: |
            ${{ needs.version.outputs.channel == 'beta' && '> ⚠️ **Versão beta** — em validação. Só recebe automaticamente quem ativou "Receber versões beta" nas Configurações. Após validada, é promovida a estável.' || 'Release estável do Monky.' }}

            Gerada a partir de `${{ needs.version.outputs.checkout_ref }}`.

            ### Downloads
            - **Windows**: instalador `.exe` (NSIS) e `.exe` portátil
            - **macOS**: `.dmg` (Intel + Apple Silicon) e `.zip`

            ### Changelog
            ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: ${{ needs.version.outputs.prerelease }}
          fail_on_unmatched_files: false
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.blockmap
            artifacts/**/latest*.yml
