name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      promote_tag:
        description: 'Beta tag to promote to a stable release (e.g. v1.8.0-beta.3). Leave empty to build a beta from the current ref.'
        required: false
        default: ''

concurrency:
  group: release-${{ github.event.inputs.promote_tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      prev_tag: ${{ steps.bump.outputs.prev_tag }}
      bump_type: ${{ steps.bump.outputs.bump_type }}
      channel: ${{ steps.bump.outputs.channel }}
      prerelease: ${{ steps.bump.outputs.prerelease }}
      checkout_ref: ${{ steps.ref.outputs.checkout_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # push to main / manual dispatch (no tag) -> beta prerelease.
      # manual dispatch with a beta tag -> promote that beta to a clean stable.
      - name: Calculate Semantic Version
        id: bump
        env:
          PROMOTE_TAG: ${{ github.event.inputs.promote_tag }}
          RELEASE_CHANNEL: beta
        run: node scripts/calculate-version.js

      - name: Resolve checkout ref
        id: ref
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.promote_tag }}" ]; then
            echo "checkout_ref=${{ github.event.inputs.promote_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "checkout_ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.platform }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.checkout_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python 3.11 (for node-gyp compatibility)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        run: npm ci

      # Upgrade node-gyp so @electron/rebuild can find VS 2022
      - name: Install node-gyp globally (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npm install -g node-gyp@latest
          echo "NODE_GYP_PATH=$(npm prefix -g)/node_modules/node-gyp/bin/node-gyp.js" >> $GITHUB_ENV

      - name: Build workspaces
        run: npm run build

      - name: Set build version
        shell: bash
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          for f in apps/client/package.json apps/server-gui/package.json; do
            node -e "const f='$f';const p=require('./'+f);p.version='${VERSION}';require('fs').writeFileSync(f, JSON.stringify(p, null, 2)+'\n');"
          done
          echo "Packaged version set to ${VERSION}"

      - name: Build ${{ matrix.platform }} distributables
        working-directory: apps/client
        run: npx --no-install electron-builder --${{ matrix.platform }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_node_gyp: ${{ env.NODE_GYP_PATH || '' }}

      # The Server GUI is a separate Electron app (host-side administration).
      # It writes to release-server/ so its artifacts never collide with the
      # Client's, which shares the same file names for update metadata.
      # Tags cut before #284 have no electron-builder config, so a promotion of
      # an older beta simply skips this step.
      - name: Detect Server GUI packaging support
        id: gui
        shell: bash
        run: |
          if node -e "process.exit(require('./apps/server-gui/package.json').build ? 0 : 1)" 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "This ref predates the Server GUI distribution; skipping."
          fi

      - name: Build Server GUI ${{ matrix.platform }} distributables
        if: steps.gui.outputs.enabled == 'true'
        working-directory: apps/server-gui
        run: npx --no-install electron-builder --${{ matrix.platform }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_node_gyp: ${{ env.NODE_GYP_PATH || '' }}

      # Each artifact keeps a single root directory on purpose: upload-artifact
      # resolves the artifact root as the common ancestor of the search paths,
      # so mixing release/ and release-server/ here would nest every file under
      # those folders and break the flat paths in checksums-sha256.txt.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml

      - name: Upload Server GUI artifacts
        if: steps.gui.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist-server-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release-server/*.exe
            release-server/*.dmg
            release-server/*.zip

  cli:
    name: Pack CLI tarball
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.checkout_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The tarball only needs shared + server, so the Electron/native download
      # triggered by the Client's install scripts is skipped here.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build shared and server
        run: |
          npm run build --workspace=packages/shared
          npm run build --workspace=apps/server

      - name: Pack CLI
        id: pack
        shell: bash
        run: |
          # Tags cut before #285 have no packer; a promotion of an older beta
          # simply ships without the CLI tarball instead of failing the release.
          if [ ! -f scripts/pack-cli.js ]; then
            echo "packed=false" >> "$GITHUB_OUTPUT"
            echo "This ref predates the CLI tarball; skipping."
            exit 0
          fi
          node scripts/pack-cli.js "${{ needs.version.outputs.version }}"
          echo "packed=true" >> "$GITHUB_OUTPUT"

      - name: Upload CLI artifact
        if: steps.pack.outputs.packed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist-cli
          if-no-files-found: error
          retention-days: 7
          path: release/monky-cli-*.tgz

  release:
    name: Publish GitHub Release
    needs: [version, build, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG="${{ needs.version.outputs.prev_tag }}"
          echo "Previous tag: ${PREV_TAG:-<none>}"
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE=""
          fi

          # Prefer the descriptive per-issue lines from commit bodies
          # (e.g. "#44: reconecta imediatamente ..."); fall back to commit
          # subjects when a commit has no such lines. This yields a written
          # changelog that still references the issues.
          ITEM_LINES=$(git log $RANGE --no-merges --pretty=format:'%b' \
            | grep -E '^#[0-9]+:' | sed -E 's/^/- /' || true)
          if [ -z "$ITEM_LINES" ]; then
            ITEM_LINES=$(git log $RANGE --no-merges --pretty=format:'- %s' || true)
          fi
          if [ -z "$ITEM_LINES" ]; then
            ITEM_LINES="- Melhorias diversas e correções."
          fi

          {
            echo "notes<<CHANGELOG_EOF"
            echo "$ITEM_LINES"
            echo ""
            echo "**Comparação completa**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...v${{ needs.version.outputs.version }}"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -R artifacts

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Generate checksums and sign artifacts
        run: |
          cd artifacts
          find . -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.tgz' \) \
            -exec sha256sum {} + | sort > checksums-sha256.txt
          echo "=== Checksums ==="
          cat checksums-sha256.txt

      - name: Sign checksums with Cosign (keyless)
        run: cosign sign-blob --yes --output-signature artifacts/checksums-sha256.txt.sig --output-certificate artifacts/checksums-sha256.txt.crt artifacts/checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.channel == 'beta' && format('Monky v{0} (Beta)', needs.version.outputs.version) || format('Monky v{0}', needs.version.outputs.version) }}
          body: |
            ${{ needs.version.outputs.channel == 'beta' && '> ⚠️ **Versão beta** — em validação. Só recebe automaticamente quem ativou "Receber versões beta" nas Configurações. Após validada, é promovida a estável.' || 'Release estável do Monky.' }}

            Gerada a partir de `${{ needs.version.outputs.checkout_ref }}`.

            ### Downloads

            **Monky (aplicativo)**
            - **Windows**: instalador `.exe` (NSIS) e `.exe` portátil
            - **macOS**: `.dmg` (Intel + Apple Silicon) e `.zip`

            **Monky Server (painel do host)**
            - `Monky-Server-*` — instalador desktop para administrar o servidor pela interface gráfica

            **Monky CLI**
            - `monky-cli-${{ needs.version.outputs.version }}.tgz` — instale com:
              ```bash
              npm install -g https://github.com/MonkyOrg/Monky/releases/download/v${{ needs.version.outputs.version }}/monky-cli-${{ needs.version.outputs.version }}.tgz
              ```

            ### Verificação de autenticidade
            Todos os artefatos são assinados com [Sigstore Cosign](https://docs.sigstore.dev/) (keyless, via OIDC do GitHub Actions).

            ```bash
            # 1. Verificar checksums
            sha256sum -c checksums-sha256.txt

            # 2. Verificar assinatura (requer cosign instalado)
            cosign verify-blob \
              --signature checksums-sha256.txt.sig \
              --certificate checksums-sha256.txt.crt \
              --certificate-identity-regexp "https://github.com/MonkyOrg/Monky" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              checksums-sha256.txt
            ```

            ### Changelog
            ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: ${{ needs.version.outputs.prerelease }}
          fail_on_unmatched_files: false
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.tgz
            artifacts/**/*.blockmap
            artifacts/**/latest*.yml
            artifacts/checksums-sha256.txt
            artifacts/checksums-sha256.txt.sig
            artifacts/checksums-sha256.txt.crt
