name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-sync:
    name: Docs traduzidos em sincronia
    runs-on: ubuntu-latest
    # Documentacao aqui deriva: ja aconteceu com o caminho de Configuracoes no
    # template de bug e com as colunas do board no AGENTS.md. Com README e
    # CONTRIBUTING em dois idiomas a superficie dobra, entao o CI cobra o par.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Conferir pares PT/EN
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          if [ -z "$BASE" ]; then
            echo "Sem contexto de PR (execucao manual) — nada a conferir."
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "Arquivos alterados:"; echo "$changed" | sed 's/^/  /'

          fail=0
          check_pair() {
            local pt="$1" en="$2"
            local pt_changed en_changed
            pt_changed=$(echo "$changed" | grep -Fx "$pt" || true)
            en_changed=$(echo "$changed" | grep -Fx "$en" || true)
            if [ -n "$pt_changed" ] && [ -z "$en_changed" ]; then
              echo "::error file=$pt::$pt mudou mas $en nao. Atualize a traducao no mesmo PR."
              fail=1
            fi
            if [ -n "$en_changed" ] && [ -z "$pt_changed" ]; then
              echo "::error file=$en::$en mudou mas $pt nao. Atualize a versao em portugues no mesmo PR."
              fail=1
            fi
          }

          check_pair "README.md" "README.en.md"
          check_pair "CONTRIBUTING.md" "CONTRIBUTING.en.md"

          if [ "$fail" -eq 0 ]; then
            echo "Pares PT/EN consistentes."
          fi
          exit $fail

  build:
    name: Build check (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python 3.11 (for node-gyp compatibility)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        run: npm ci

      # Upgrade node-gyp so @electron/rebuild can find VS 2022
      - name: Install node-gyp globally (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npm install -g node-gyp@latest
          echo "NODE_GYP_PATH=$(npm prefix -g)/node_modules/node-gyp/bin/node-gyp.js" >> $GITHUB_ENV

      - name: Build workspaces
        run: npm run build

      # Mirror the release pipeline: tsc does not copy the .sql migration files
      # into the compiled server output, so we copy them next to the compiled
      # DatabaseConnection.js before packaging.
      - name: Copy database migrations into server dist
        shell: bash
        run: |
          mkdir -p apps/server/dist/infrastructure/database/migrations
          cp apps/server/src/infrastructure/database/migrations/*.sql \
             apps/server/dist/infrastructure/database/migrations/

      # Packaging check only (unpacked --dir, no publish). This compiles and
      # rebuilds any native modules against the Electron ABI on real
      # windows-2022 / macos-latest runners, catching native build and
      # packaging regressions on every PR without generating a release.
      - name: Package ${{ matrix.platform }} (dir, no publish)
        working-directory: apps/client
        run: npx --no-install electron-builder --${{ matrix.platform }} --dir --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_node_gyp: ${{ env.NODE_GYP_PATH || '' }}
