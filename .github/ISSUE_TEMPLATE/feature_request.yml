name: ✨ Sugerir uma funcionalidade
description: Propor uma melhoria ou funcionalidade nova.
labels: ['enhancement']
body:
  - type: textarea
    id: problema
    attributes:
      label: Problema
      description: Que dor isso resolve, e para quem? Descreva a situação, não a solução.
      placeholder: |
        Quem hospeda o servidor não tem como saber quem entrou enquanto esteve fora.
    validations:
      required: true

  - type: textarea
    id: solucao
    attributes:
      label: Solução proposta
      description: O que você gostaria que acontecesse.
    validations:
      required: true

  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas consideradas
      description: Outras formas de resolver o mesmo problema, se você pensou em alguma.
    validations:
      required: false

  - type: textarea
    id: contexto
    attributes:
      label: Contexto adicional
      description: Capturas de tela, exemplos de outros apps ou qualquer coisa que ajude.
    validations:
      required: false
