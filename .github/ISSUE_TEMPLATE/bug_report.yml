name: 🐛 Reportar um bug
description: Algo no Mini Voice não funciona como deveria.
labels: ['bug']
body:
  - type: textarea
    id: descricao
    attributes:
      label: Descrição
      description: O que aconteceu?
      placeholder: Ao clicar em desmutar, o microfone continua mutado.
    validations:
      required: true

  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Conectar em um servidor
        2. Entrar em um canal de voz
        3. Clicar em mutar e depois desmutar
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Comportamento esperado
      placeholder: O microfone volta a transmitir.
    validations:
      required: true

  - type: input
    id: versao
    attributes:
      label: Versão do Mini Voice
      description: Está em **Configurações › Sobre e Updates › Versão atual**.
      placeholder: v1.10.0
    validations:
      required: true

  - type: dropdown
    id: so
    attributes:
      label: Sistema operacional
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: textarea
    id: contexto
    attributes:
      label: Contexto adicional
      description: Logs, capturas de tela ou qualquer outra informação útil.
    validations:
      required: false
